<!doctype html><meta charset="utf-8"><title>内嵌文档预览测试</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font:16px Arial}
header{height:64px;background:#ffe900;padding:20px}footer{position:absolute;bottom:0;height:40px;background:#ff00e0;width:100%}
iframe{position:absolute;left:32px;top:80px;width:calc(100% - 64px);height:calc(100% - 136px);border:4px solid #123456}
.help{position:fixed;right:70px;bottom:100px;background:#ff00c0;width:120px;height:50px;z-index:99}
#body{position:absolute;inset:44px 16px 28px;overflow:auto;scroll-snap-type:y mandatory}
.row{height:52px;padding:12px 28px;scroll-snap-align:start}.end{height:40px;background:#fff;padding:12px}
</style><header>外层工具栏不应出现在正文长图</header><footer>预览控件</footer><div class="help">浮动按钮</div>
<script>
const p=new URLSearchParams(location.search),mode=p.get('mode')||'same',leaf=p.has('leaf'),depth=Number(p.get('depth')||0);
if(leaf){
 const body=document.createElement('main');body.id='body';document.body.append(body);
 body.innerHTML=Array.from({length:80},(_,i)=>`<div class="row" data-archive-row style="background:rgb(${80+i},${140+i%70},${210-i})">文档正文 ${i+1} · ${i*i}</div>`).join('')+'<div class="end" data-archive-end>没有更多内容</div>';
 if(mode==='canvas'){
  const c=document.createElement('canvas');c.width=900;c.height=4160;const ctx=c.getContext('2d');
  for(let i=0;i<80;i++){ctx.fillStyle=`rgb(${80+i},${140+i%70},${210-i})`;ctx.fillRect(0,i*52,c.width,52);ctx.fillStyle='#102030';ctx.fillText('PDF raster row '+i,40,i*52+25);}
  c.style.height='4160px';c.style.display='block';c.style.width='100%';body.replaceChildren(c);const end=document.createElement('div');end.className='end';end.dataset.archiveEnd='';end.textContent='没有更多内容';body.append(end);
 }
}else{
 const frame=document.createElement('iframe'),url=new URL(location.href);
 url.searchParams.set('depth',String(depth+1));
 if(mode==='cross'||mode==='nested')url.hostname=location.hostname==='127.0.0.1'?'localhost':'127.0.0.1';
 if(mode!=='nested'||depth>=1)url.searchParams.set('leaf','1');
 frame.src=url.href;document.body.append(frame);
 if(mode==='clipped')frame.style.height='1200px';
 if(mode==='transformed')frame.style.transform='scale(.9)';
 if(mode==='two'){frame.style.width='48%';frame.style.left='0';const other=frame.cloneNode();other.style.left='52%';document.body.append(other);}
}
</script>
