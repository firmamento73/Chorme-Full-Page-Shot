<!doctype html><html><head><meta charset="utf-8"><title>内部滚动待办测试</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font:14px Arial,sans-serif}
.app{position:fixed;inset:0;overflow:hidden;background:#e9edf3}header{height:60px;background:#fff;padding:20px}
aside{position:absolute;left:0;top:60px;bottom:0;width:220px;overflow:auto;background:#d4dce7}aside p{height:36px;margin:0;padding:8px}
main{position:absolute;left:244px;right:24px;top:88px;bottom:24px;overflow:hidden}
.toolbar{height:48px;background:white;padding:12px}.panels{position:absolute;top:48px;bottom:0;left:0;right:0;display:flex;gap:20px}
.panel{position:relative;flex:1;min-width:0;overflow:hidden}.scroll-body{height:100%;overflow:hidden;background:white;scroll-snap-type:y mandatory}
.row{height:52px;padding:12px 28px;color:#102030;scroll-snap-align:start}.end{height:40px;background:#fff;padding:12px}
.floating{position:fixed;right:28px;bottom:40px;padding:12px;background:#ff0099;z-index:20}
</style></head><body><div class="app"><header>待办工作台</header><aside></aside><main><div class="toolbar">内部表格 / 待办事项</div><div class="panels"></div></main><div class="floating">悬浮帮助</div></div><script>
const params=new URLSearchParams(location.search),kind=params.get('kind')||'hidden',count=80;
document.querySelector('aside').innerHTML=Array.from({length:150},(_,i)=>`<p>导航菜单 ${i}</p>`).join('');
const markup=()=>`<div class="scroll-body" id="todo-body">${Array.from({length:count},(_,i)=>`<div class="row" data-archive-row style="background:rgb(${80+i},${140+i%70},${210-i})">待办 ${i+1} · 审批记录 ${i*i}</div>`).join('')}<div class="end" data-archive-end>没有更多内容</div></div>`;
const panels=document.querySelector('.panels');
for(let n=0;n<(kind==='two'?2:1);n++){
 const panel=document.createElement('div');panel.className='panel';panels.append(panel);
 if(kind==='shadow'){const shadow=panel.attachShadow({mode:'open'});shadow.innerHTML='<style>'+document.querySelector('style').textContent+'</style>'+markup();window.testRoot=shadow.querySelector('.scroll-body');}
 else{panel.innerHTML=markup();window.testRoot=panel.querySelector('.scroll-body');}
 if(kind==='auto')window.testRoot.style.overflowY='auto';
 if(kind==='locked')window.testRoot.scrollTo=()=>{};
}
window.expectedHeight=count*52+40;
</script></body></html>
