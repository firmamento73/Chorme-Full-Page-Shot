name: Publish extension release
on:
  push:
    branches: [main]
    paths:
      - manifest.json
      - .github/workflows/release.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: extension-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate JavaScript and pixel alignment
        run: |
          for file in *.js tests/*.js; do
            node --check "$file"
          done
          node --test tests/core.test.js tests/seams.test.js
      - name: Build release ZIP and notes
        run: |
          python scripts/package.py
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          version = json.loads(Path('manifest.json').read_text())['version']
          assert re.fullmatch(r'\d+\.\d+\.\d+(?:\.\d+)?', version)
          changelog = Path('CHANGELOG.md').read_text()
          heading = '## ' + version + '\n'
          assert heading in changelog
          notes = changelog.split(heading, 1)[1].split('\n## ', 1)[0].strip()
          notes += '\n\n提供 F12 整页截图和滚动归档两种模式，支持连续长图、连续长 PDF、分页 PDF 和离线笔记总览。\n'
          notes += '\n安装：下载下面的 `fullpage-shot-' + version + '.zip` 并解压，在 Chrome 扩展管理页选择包含 `manifest.json` 的目录。更新时覆盖原安装目录并刷新扩展、目标网页。\n'
          minimum = json.loads(Path('manifest.json').read_text())['minimum_chrome_version']
          notes += '\nChrome ' + minimum + ' 及以上；权限不变。详细说明见仓库 README。\n'
          Path('release-notes.txt').write_text(notes)
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('RELEASE_TAG=v' + version + '\n')
              env.write('RELEASE_VERSION=' + version + '\n')
              env.write('RELEASE_ZIP=dist/fullpage-shot-' + version + '.zip\n')
          PY
      - name: Publish latest release with installable ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$RELEASE_ZIP" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest --notes-file release-notes.txt
          else
            gh release create "$RELEASE_TAG" "$RELEASE_ZIP" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Full Page Shot $RELEASE_VERSION · 双模式网页截图" --notes-file release-notes.txt --latest
          fi
